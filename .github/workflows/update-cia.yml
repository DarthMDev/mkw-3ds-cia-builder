# Builds the code-only update CIA for each published release (a check) and,
# only when run by hand with attach, adds it to that release.
# No disc is involved: the update CIA reads the game files that each player's
# builder put on their SD card (build/release/sd-card/3ds).
name: Update CIA

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag or branch to build (e.g. v0.4.0)
        required: true
      attach:
        description: Attach the CIA to that tag's release
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # devkitPro's image compiles; its glibc is too old for the pinned makerom.
  compile:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 python3-venv ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 tools/bootstrap.py
      - name: Compile
        # The game says "quick update: no rebuild needed" on its first launch.
        env:
          MKW_QUICK_UPDATE: '1'
        run: python3 tools/build.py --release --jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: elf
          path: build/mkw-3ds.elf

  package:
    needs: compile
    runs-on: ubuntu-24.04
    # Waits for the repository owner's approval (Settings > Environments >
    # release): an attached update reaches every player through the QR codes.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: elf
          path: build
      - name: Package
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet numpy Pillow
          .venv/bin/python tools/release/package_cia.py --update --version "$(cat tools/release/VERSION)" \
            --output "$PWD/MKW-3DS-Update-${TAG}.cia"
          # A fixed name too, so releases/latest/download/MKW-3DS-Update.cia (the
          # FBI QR code and the Universal-Updater store) always gets the newest.
          cp "MKW-3DS-Update-${TAG}.cia" MKW-3DS-Update.cia
      - uses: actions/upload-artifact@v4
        with:
          name: MKW-3DS-Update-${{ env.TAG }}
          path: MKW-3DS-Update-*.cia
      - name: Attach to the release
        # Only on request (Run workflow -> attach): players installed the
        # update CIA without building the game, so a release no longer gets
        # one automatically. The build still runs as a check.
        if: inputs.attach
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            MKW-3DS-Update-*.cia
            MKW-3DS-Update.cia
